# comfy-test — https://github.com/PozzettiAndrea/comfy-test
# Run locally: cd ComfyUI-Recgen && comfy-test run --platform macos
# Quick check: comfy-test run --level registration

[test]
comfyui_version = "latest"
python_version = "3.11"
# CI runs validation + execution_light (see test-install.yml; no --level override).
levels = [
  "syntax",
  "install",
  "registration",
  "validation",
  "execution_light",
]

[test.platforms]
linux = true
macos = true
windows = true
windows_portable = false

[test.workflows]
timeout = 300
# Consumer: RecGen example preview. Dev test: bundled cube.obj via Preview3D (path widget).
cpu = ["load_example_preview.json", "preview3d_cube.json"]
# Full 2D→3D smoke — self-hosted GPU runners only (downloads HF weights).
gpu = ["recgen_smoke.json"]

[test.macos]
enabled = true

[test.linux]
enabled = true

[test.windows]
enabled = true
