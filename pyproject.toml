[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui_recgen"
version = "0.0.1"
description = "ComfyUI custom nodes for RecGen 2D RGB-D to 3D reconstruction"
authors = [
  {name = "Kaili Yang", email = "124ykl@gmail.com"}
]
readme = "README.md"
license = {text = "GNU General Public License v3"}
requires-python = ">=3.10"
keywords = [
  "comfyui",
  "comfyui-nodes",
  "recgen",
  "image-to-3d",
  "rgb-d",
  "3d-reconstruction",
  "gaussian-splatting",
  "mesh-generation",
  "depth-map",
  "single-view-3d",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "torch>=2.0",
    "torchvision",
    "numpy",
    "scipy",
    "Pillow",
    "trimesh",
    "safetensors",
    "huggingface-hub",
    "easydict",
    "tqdm",
    "plyfile",
    "opencv-python-headless",
    "PyYAML",
    "certifi",
    "transformers",
]



[project.optional-dependencies]
dev = [
    "bump-my-version",
    "coverage",  # testing
    "mypy",  # linting
    "pre-commit", # runs linting on commit
    "pytest",  # testing
    "ruff",  # linting
]

[project.urls]
Homepage = "https://github.com/kaili-yang/ComfyUI-Recgen"
Repository = "https://github.com/kaili-yang/ComfyUI-Recgen"
BugTracker = "https://github.com/kaili-yang/ComfyUI-Recgen/issues"
Documentation = "https://github.com/kaili-yang/ComfyUI-Recgen#readme"


[tool.comfy]
PublisherId = "kaili-yang"
DisplayName = "ComfyUI-Recgen"
Icon = ""
Tags = ["3d", "recgen", "image-to-3d", "rgb-d", "mesh", "gaussian-splat", "comfyui", "depth"]
Repository = "https://github.com/kaili-yang/ComfyUI-Recgen"

includes = []

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
# extend-exclude = ["static", "ci/templates"]
line-length = 140
src = ["src", "tests"]
target-version = "py39"

# Add rules to ban exec/eval
[tool.ruff.lint]
select = [
    "S102",  # exec-builtin
    "S307",  # eval-used
    "W293",
    "F",  # The "F" series in Ruff stands for "Pyflakes" rules, which catch various Python syntax errors and undefined names.
    # See all rules here: https://docs.astral.sh/ruff/rules/#pyflakes-f
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
